name: Deploy to Reg.ru

on:
  push:
    branches:
      - main  # Запускается при пуше в main
      - master  # Или master, если используете его
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Раскомментируйте, если используете environment secrets:
    # environment: КУПКГ
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build web app (with API base override)
      env:
        PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
      run: |
        if [ -n "$PROD_API_BASE_URL" ]; then
          echo "Using PROD_API_BASE_URL from secrets"
          flutter build web --release --web-renderer html \
            --dart-define=API_BASE_URL=$PROD_API_BASE_URL
        else
          echo "No PROD_API_BASE_URL secret set, building without override (uses EnvironmentConfig)"
          flutter build web --release --web-renderer html
        fi
      
    - name: Copy .htaccess for Reg.ru
      run: |
        if [ -f "web_config/.htaccess" ]; then
          cp web_config/.htaccess build/web/.htaccess
          echo "✅ .htaccess copied from web_config/.htaccess"
        else
          echo "⚠️ web_config/.htaccess not found, creating minimal .htaccess"
          echo "# SPA routing" > build/web/.htaccess
          echo "RewriteEngine On" >> build/web/.htaccess
          echo "RewriteBase /" >> build/web/.htaccess
          echo "# Редирект HTTP → HTTPS отключен (настраивается на уровне хостинга)" >> build/web/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} !-f" >> build/web/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} !-d" >> build/web/.htaccess
          echo "RewriteRule . /index.html [L]" >> build/web/.htaccess
        fi
        
    - name: Deploy to Reg.ru via SFTP/FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.REG_RU_FTP_HOST }}
        username: ${{ secrets.REG_RU_FTP_USER }}
        password: ${{ secrets.REG_RU_FTP_PASSWORD }}
        protocol: ftps  # Попробуйте ftps вместо ftp
        port: 21  # Или 22 для SFTP, 990 для FTPS
        local-dir: ./build/web/
        server-dir: ./
        dangerous-clean-slate: false  # Не удалять существующие файлы
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.DS_Store
          .git
          .gitignore
          
    - name: Deployment summary
      run: |
        echo "✅ Deployment completed successfully!"
        echo "📦 Build directory: build/web"
        echo "🌐 Deployed to: Reg.ru /www/fastselect.ru"
        echo "🔗 Site URL: https://fastselect.ru"

